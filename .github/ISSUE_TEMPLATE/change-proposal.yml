name: Change proposal
description: Propose a reusable improvement to the playbook, skill, templates, or guide.
title: "[Proposal]: "
labels: ["proposal"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Human guide
        - Agent skill
        - Private-project template
        - Existing-site critique
        - Content pipeline
        - Documentation website
        - Versioning and governance
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What reusable problem does the current toolkit fail to solve?
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: dropdown
    id: compatibility
    attributes:
      label: Compatibility impact
      options:
        - Patch — clarification or correction
        - Minor — backward-compatible addition
        - Major — migration or breaking change
        - Unsure
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or examples

