<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta name="theme-color" content="#222839">
    <title>{{ page.title | default: site.title }}{% unless page.title == site.title %} · {{ site.title }}{% endunless %}</title>
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700;800&family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="site-header-inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="Church Website Blueprint home">
          <img class="brand-logo" src="{{ '/assets/digital-deacon-logo.svg' | relative_url }}" alt="Digital Deacon">
          <span class="brand-separator" aria-hidden="true"></span>
          <span class="brand-product">Church Website<br>Blueprint</span>
        </a>
        <nav aria-label="Primary navigation">
          <a href="{{ '/humans/' | relative_url }}">For people</a>
          <a href="{{ '/agents/' | relative_url }}">For agents</a>
          <a href="{{ '/structure/' | relative_url }}">Structure</a>
          <a href="{{ '/versioning/' | relative_url }}">Versions</a>
          <a class="nav-toolkit" href="{{ site.github.repository_url | default: '#' }}">View toolkit <span aria-hidden="true">↗</span></a>
        </nav>
      </div>
    </header>
    <main id="main">
      {{ content }}
    </main>
    <footer class="site-footer">
      <div class="site-footer-inner">
        <div>
          <p class="footer-parent"><a href="https://digitaldeacon.org">Digital Deacon</a> project</p>
          <p class="footer-title">Church Website Blueprint</p>
          <p class="footer-copy">Source-faithful discovery, content, design, and launch.</p>
        </div>
        <div class="footer-links">
          <a href="{{ '/humans/' | relative_url }}">Run the process</a>
          <a href="{{ '/agents/' | relative_url }}">Agent setup</a>
          <a href="{{ site.github.repository_url | default: '#' }}">GitHub repository <span aria-hidden="true">↗</span></a>
        </div>
      </div>
    </footer>
  </body>
</html>
